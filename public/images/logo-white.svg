<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none" aria-label="Learnivia">
  <!-- Owl icon mark: simplified geometric, warm white on dark -->
  <g transform="translate(0, 4)">
    <!-- Body -->
    <ellipse cx="16" cy="20" rx="10" ry="12" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="12.5" cy="18" r="3.5" fill="white" opacity="0.9"/>
    <circle cx="19.5" cy="18" r="3.5" fill="white" opacity="0.9"/>
    <circle cx="12.5" cy="18" r="1.75" fill="#2D6A4F"/>
    <circle cx="19.5" cy="18" r="1.75" fill="#2D6A4F"/>
    <!-- Beak -->
    <path d="M14.5 21.5 L16 23.5 L17.5 21.5 Z" fill="rgba(201,146,42,0.9)"/>
    <!-- Ear tufts -->
    <path d="M9 10 L12 15 L7 13 Z" fill="white" opacity="0.8"/>
    <path d="M23 10 L20 15 L25 13 Z" fill="white" opacity="0.8"/>
    <!-- Wings hint -->
    <path d="M6 20 Q4 25 6 28 Q9 27 10 24" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <path d="M26 20 Q28 25 26 28 Q23 27 22 24" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
  <!-- Wordmark -->
  <text x="38" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="white" letter-spacing="-0.3">learnivia</text>
</svg>
